name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - master # Change this to your default branch name if different

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        run: |
          # Fetch latest mdBook release tag (for example: v0.4.40)
          MDBOOK_VERSION=$(curl -fsSL https://api.github.com/repos/rust-lang/mdBook/releases/latest | grep -Po '"tag_name":\s*"\K[^"]+')
          MDBOOK_ARCHIVE="mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"

          # Download and install the precompiled Linux binary
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/${MDBOOK_VERSION}/${MDBOOK_ARCHIVE}" | tar -xz
          mkdir -p "$HOME/.local/bin"
          install -m 755 mdbook "$HOME/.local/bin/mdbook"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mdbook --version

      - name: Build Book
        run: mdbook build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './book' # Default output directory for mdBook

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

