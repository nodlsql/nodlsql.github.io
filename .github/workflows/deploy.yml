name: Deploy mdBook to GitHub Pages

on:
  push:
    branches:
      - master # Change this to your default branch name if different

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps: deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install mdBook
        run: |
          # Fetch latest precompiled binary download link for Linux
          MDBOOK_VERSION=$(curl -s https://github.com | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -sSL https://github.com | tar -xz
          mv mdbook /usr/local/bin/

      - name: Build Book
        run: mdbook build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './book' # Default output directory for mdBook

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

